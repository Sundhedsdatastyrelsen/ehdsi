name: ep-portal

services:
  ep-portal:
    container_name: ep-portal
    # Host deploys `docker compose pull` this image; the build: block below is for
    # local development.
    image: ghcr.io/sundhedsdatastyrelsen/ehdsi/ep-portal:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./bin/ep-portal", "--profile=training"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/home/app/data
      - ./config:/home/app/config:ro
      - ../NCP/keystore:/home/app/ncp-keystore:ro
    # Traefik (in the FSEU stack) runs with host networking, so it reaches this container on its own default network.
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.ep-portal.loadbalancer.server.port=8080"
      - "traefik.http.routers.ep-portal.rule=Host(`ncp-training.ehdsi.sundhedsdata.dk`)"
      - "traefik.http.routers.ep-portal.entrypoints=web"
      - "traefik.http.routers.ep-portal.service=ep-portal"
      - "traefik.http.routers.ep-portal.middlewares=redirect-to-https@file"
      - "traefik.http.routers.ep-portal-secure.rule=Host(`ncp-training.ehdsi.sundhedsdata.dk`)"
      - "traefik.http.routers.ep-portal-secure.entrypoints=websecure"
      - "traefik.http.routers.ep-portal-secure.service=ep-portal"
      - "traefik.http.routers.ep-portal-secure.tls=true"
      - "traefik.http.routers.ep-portal-secure.tls.certresolver=httpchallenge"
    environment:
      TZ: "Europe/Copenhagen"
      JAVA_OPTS: "-javaagent:opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: ep-portal
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=${GRAFANA_ENVIRONMENT:-Training}"
      OTEL_TRACES_SAMPLER: "always_on"
    extra_hosts:
      # https://docs.docker.com/reference/cli/dockerd/#configure-host-gateway-ip
      - "host.docker.internal:host-gateway" # to allow connections to alloy-hub
      - "ncp-training.ehdsi.sundhedsdata.dk:host-gateway"
    restart: unless-stopped
    depends_on:
      - ep-portal-init

  # ep-portal runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for the service to start correctly.
  # Recurse (-R) so an already-present opt-out.sqlite (owned by another uid from a
  # prior deploy or a host-side copy) also becomes writable — otherwise reads work
  # but writes fail with SQLITE_READONLY the first time a mutation is persisted.
  ep-portal-init:
    image: busybox
    user: root
    entrypoint:
      - "chown"
      - "-R"
      - "10001:10001"
      - "/home/app/data"
    volumes:
      - ./data:/home/app/data
