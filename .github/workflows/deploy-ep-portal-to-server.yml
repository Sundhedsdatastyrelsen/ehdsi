name: Deploy ep-portal with Docker Compose

on:
  workflow_run:
    workflows:
      - "Build ep-portal image"
    types:
      - "completed"
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEV_VM_USER }}@${{ secrets.DEV_VM_HOST }} << 'EOF'
            # 1. Clone or pull the latest changes from your repository
            if [ -d "/opt/ehdsi" ]; then
              cd /opt/ehdsi && git pull
            else
              git clone https://github.com/Sundhedsdatastyrelsen/ehdsi.git /opt/ehdsi
            fi

            cd /opt/ehdsi/eprescription-portal

            # 2. Log in to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Pull the Docker images (if any are specified in the docker-compose.yml)
            docker compose pull

            # 4. Deploy the services
            docker compose up -d
          EOF
