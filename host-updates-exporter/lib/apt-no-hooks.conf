// The host's /etc/apt is mounted into the container so apt sees the host's
// sources, pinning, proxy and credentials. Its hooks call host binaries
// (update-notifier, command-not-found, the Ubuntu Pro ESM hook) that don't
// exist here, so they are cleared. Loaded with `apt-get -c`, after the host's
// apt.conf.d.
#clear APT::Update::Pre-Invoke;
#clear APT::Update::Post-Invoke;
#clear APT::Update::Post-Invoke-Success;
#clear APT::Update::Post-Invoke-Stats;
#clear DPkg::Pre-Invoke;
#clear DPkg::Post-Invoke;
#clear DPkg::Pre-Install-Pkgs;
#clear AptCli::Hooks;
#clear binary::apt::AptCli::Hooks;
