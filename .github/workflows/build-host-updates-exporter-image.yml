# Builds and publishes the host-updates-exporter image (see host-updates-exporter/README.md).
# Follows the same pattern as build-epps-image.yml.
name: Host Updates Exporter Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'host-updates-exporter/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  build-host-updates-exporter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Generate docker-bake.hcl
      run: |
        cat > host-updates-exporter/docker-bake.hcl <<EOL
        group "default" {
          targets = ["host-updates-exporter"]
        }

        target "host-updates-exporter" {
          dockerfile = "Dockerfile"
          platforms = ["linux/amd64"]
          cache-from = [
            "type=registry,ref=ghcr.io/sundhedsdatastyrelsen/ehdsi/host-updates-exporter:cache"
          ]
          cache-to = [
            "type=registry,ref=ghcr.io/sundhedsdatastyrelsen/ehdsi/host-updates-exporter:cache"
          ]
          tags = [
            "ghcr.io/sundhedsdatastyrelsen/ehdsi/host-updates-exporter:latest",
            "ghcr.io/sundhedsdatastyrelsen/ehdsi/host-updates-exporter:build-${{ github.run_number }}"
          ]
          output = [
            "type=image,push=true"
          ]
        }
        EOL

    # https://stackoverflow.com/a/75544124
    - name: Build and push images
      run: |
        cd host-updates-exporter
        docker buildx bake --file docker-bake.hcl --push
