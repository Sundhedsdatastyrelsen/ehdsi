# host-updates-docker-proxy: the exporter's only way to Docker. Lets through
# listing containers, reading their and their images' configuration, and the
# Docker version; refuses everything else with 403. Only the exporter can
# reach it (see docker-compose.yml).
#
# The ops repos keep a copy next to their compose file; change them together.
# A running proxy keeps the file it started with: restart it after a change.

global
    log stdout format raw local0
    maxconn 50

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend api
    bind :2375
    # Anchored, and IDs only of hex digits: no "..", no encoded slashes, no
    # API version prefix. The query string isn't part of the path.
    acl allowed_path path -m reg ^/(containers/json|containers/[0-9a-f]+/json|images/sha256:[0-9a-f]+/json|version)$
    http-request deny deny_status 403 unless { method GET } allowed_path
    default_backend docker_socket

backend docker_socket
    server docker unix@/var/run/docker.sock
