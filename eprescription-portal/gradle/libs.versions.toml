[versions]
kotlin = "2.2.20"

assertk = "0.28.1"
bouncycastle = "1.84"
flyway = "12.9.0"
freemarker = "2.3.34"
hoplite = "2.9.0"
jackson = "2.21.3"
jdbi = "3.53.0"
javalin = "7.2.0"
kotest = "6.1.1"
logback = "1.5.32"
mockito = "5.23.0"
mockito-kotlin = "6.3.0"
nimbus-oauth2-oidc-sdk = "11.37"
okhttp = "5.3.2"
slf4j = "2.0.17"
sqlite = "3.53.0.0"

[libraries]
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
bouncycastle-bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }
hoplite-core = { module = "com.sksamuel.hoplite:hoplite-core", version.ref = "hoplite" }
hoplite-toml = { module = "com.sksamuel.hoplite:hoplite-toml", version.ref = "hoplite" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
javalin-rendering = { module = "io.javalin:javalin-rendering-freemarker", version.ref = "javalin" }
javalin-ssl-plugin = { module = "io.javalin.community.ssl:javalin-ssl", version.ref = "javalin" }
jcl-over-slf4j = { module = "org.slf4j:jcl-over-slf4j", version.ref = "slf4j" }
jdbi3-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
nimbus-oauth2-oidc-sdk = { module = "com.nimbusds:oauth2-oidc-sdk", version.ref = "nimbus-oauth2-oidc-sdk" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
