# Overlay for ./gradlew run (see build.gradle.kts). Its values take precedence over application.toml.

[webapp]
# Hot-reloads templates and static files from src/main/resources. This only works when running locally from the
# project directory, e.g. with ./gradlew run: a deployed app has no src/ directory to reload from.
hotReloading = true

# Patient search through the OpenNCP client connector in the local NCP docker-compose stack in ../NCP. Without the NCP
# stack running, patient search fails.
# The connector requires https (its WS-Policy rejects plain http), but a client certificate is not needed. Its dev
# certificate (NCP/keystore/dev-client-connector-tls.jks) is issued to openncp-client and localhost.
[openncp]
endpoint = "https://localhost:6443/openncp-client-connector/services/ClientService"
truststore = { path = "../NCP/keystore/dev-truststore.jks", password = "changeit" }

[openncp.signing]
alias = "tomcat"
keystore = { path = "../NCP/keystore/dev-seal.jks", password = "password" }
